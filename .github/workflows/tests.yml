name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
  push:
    branches: [ "main" ]

env:
  # Keep in step with the Flutter version in docs/DEVELOPMENT.md.
  FLUTTER_VERSION: '3.44.9'

jobs:
  unit-tests:
    name: Unit and widget tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      # Reported on the run's summary page; it doesn't fail the build.
      - name: Coverage report
        run: |
          set -o pipefail
          dart run tool/coverage_report.dart | tee coverage/summary.txt
          { echo '### Coverage'; echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    name: E2E tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration for the Android emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The emulator reaches the host's mock tracker at 10.0.2.2.
      - name: Point the app at the mock tracker
        run: echo 'TRACKER_URL=http://10.0.2.2:8080/' > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Start the mock tracker
        run: |
          nohup dart run tool/mock_tracker.dart 8080 > mock-tracker.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && exit 0
            sleep 2
          done
          cat mock-tracker.log
          exit 1

      - name: Run e2e tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test

      - name: Upload mock tracker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-tracker-log
          path: mock-tracker.log
          retention-days: 7

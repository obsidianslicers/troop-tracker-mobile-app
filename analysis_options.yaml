# Static analysis and formatting rules. CI runs `flutter analyze` and
# `dart format --set-exit-if-changed .`; both must pass before a PR merges.
include: package:flutter_lints/flutter.yaml

formatter:
  # Matches the main Troop Tracker repo's 100-character line limit.
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - lib/firebase_options.dart

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    unnecessary_lambdas: true
